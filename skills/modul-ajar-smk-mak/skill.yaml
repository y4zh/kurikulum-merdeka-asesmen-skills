name: "modul_ajar_smk_mak"
title: "Modul Ajar SMK/MAK (Fase E-F)"
description: "Design Indonesian Kurikulum Merdeka teaching modules (modul ajar) for SMK/MAK Fase E-F (Kelas X-XII): derive Tujuan Pembelajaran (TP) and Alur Tujuan Pembelajaran (ATP) from Capaian Pembelajaran (CP) for general subjects and for vocational competency elements of a konsentrasi keahlian, plan deep learning experiences in the Memahami, Mengaplikasi, and Merefleksi stages mapped to SOLO levels and carried by project work and guided workshop practice, target the 8 Dimensi Profil Lulusan, build differentiated LKPD in jobsheet form with safety notes and observation tables, place formative checkpoints, turn assessment follow-up bands into concrete classroom and workshop intervention scenarios, and hand a clean TP list to the SMK/MAK assessment skill."
