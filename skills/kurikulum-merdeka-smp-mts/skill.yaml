name: "kurikulum_merdeka_smp_mts"
title: "Kurikulum Merdeka SMP/MTs (Fase D)"
description: "Complete Indonesian Kurikulum Merdeka toolkit for SMP/MTs only (Fase D, Kelas VII-IX) in one skill with five roles: teaching modules that derive TP and ATP from Fase D CP with deep-learning stages (Memahami, Mengaplikasi, Merefleksi) mapped to SOLO and differentiated LKPD; calibrated stimulus texts and functional visuals at Fase D reading loads; complete assessment packages with 4-option PG (A-D), the 25:50:25 LOTS:MOTS:HOTS default derived from the verified AKM Numerasi Kelas 8 distribution plus the Kelas 8 Literasi distribution, the full Pusmendik format set, dynamic MCMA scoring, descriptive KKTP rubrics, and Mastery Learning remedial follow-up; independent item review with the Pusmendik card, misconception-based distractor surgery, the key-distribution audit R = (PG items / options) + 3, and quantitative item analysis with 27 percent upper and lower groups and the 5 percent distractor-effectiveness rule; and conversion of finished packages into Kartu Soal, print-ready exam scripts, and GIFT, Moodle XML, CSV, and JSON exports for CBT and LMS platforms."
