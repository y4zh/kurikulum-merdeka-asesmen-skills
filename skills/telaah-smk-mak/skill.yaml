name: "telaah_smk_mak"
title: "Telaah & Validasi Butir Soal SMK/MAK"
description: "Independent second-pass review of Kurikulum Merdeka test items and practical assessment rubrics for SMK/MAK Fase E-F (Kelas X-XII) written by anyone (AI, a teacher, or an MGMP team): qualitative review with the Pusmendik review card (Materi, Konstruksi, Bahasa codes for PG/PGK and Uraian, with the five-option rule of this jenjang), a verdict per item (accept, revise, or reject with reasons), distractor surgery that rewrites failed options from named student misconceptions, a dedicated review of performance rubrics (criterion clarity, observability, specification link, safety/K3 coverage), quantitative item analysis when trial scores are supplied (difficulty index P, discrimination index D with top and bottom 27 percent groups, distractor effectiveness at 5 percent), and the key-distribution check R inherited from the SMK/MAK assessment skill."
category: "Work and knowledge"
