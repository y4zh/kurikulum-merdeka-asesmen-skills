name: "stimulus_paud_tk"
title: "Stimulus & Ilustrasi PAUD & TK/RA"
description: "Design concrete stimulus media for Indonesian Kurikulum Merdeka PAUD and TK/RA only (Kelompok Bermain, Taman Kanak-Kanak, Raudhatul Athfal): large pictures, real objects, songs and movement, puppets, and oral picture stories that a child must see, hear, or handle before responding, each passing a functionality test with named key objects, visual and material guidance calibrated to early childhood including safety rules for real objects, and no long reading texts or reading-dependent media at this level."
