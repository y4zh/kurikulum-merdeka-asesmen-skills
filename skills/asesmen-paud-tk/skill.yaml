name: "asesmen_paud_tk"
title: "Asesmen PAUD & TK/RA"
description: "Design complete Indonesian Kurikulum Merdeka assessment packages for PAUD and TK/RA only (early childhood: Kelompok Bermain, Taman Kanak-Kanak, Raudhatul Athfal): a clarification gate before instrument design, goals derived from the PAUD CP elements (Nilai Agama dan Budi Pekerti; Jati Diri; Dasar Literasi, Matematika, Sains, Teknologi, Rekayasa, dan Seni), observation checklists, anecdotal records, developmental rating scales and performance rubrics, interpretation in the BB, MB, BSH, and BSB developmental categories, play-based follow-up stimulation plans, and a mandatory instrument quality audit, with no written tests or multiple choice at this level."
