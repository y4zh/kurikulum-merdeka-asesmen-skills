title: "Modul Ajar SMP/MTs (Fase D)"
description: "Design Indonesian Kurikulum Merdeka teaching modules (modul ajar) for SMP/MTs (Fase D, Kelas VII-IX): derive Tujuan Pembelajaran (TP) and Alur Tujuan Pembelajaran (ATP) from Fase D Capaian Pembelajaran (CP), plan deep learning experiences in the Memahami, Mengaplikasi, and Merefleksi stages mapped to SOLO levels, target the 8 Dimensi Profil Lulusan, build differentiated LKPD and formative checkpoints for Fase D learners, turn assessment follow-up bands into concrete classroom intervention scenarios, and hand a clean TP list to the asesmen-smp-mts skill for item writing."
