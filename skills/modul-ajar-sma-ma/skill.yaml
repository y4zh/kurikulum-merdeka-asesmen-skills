description: "Plan Indonesian Kurikulum Merdeka teaching modules for SMA/MA Fase E-F (Kelas 10-12): derive Tujuan Pembelajaran (TP) and Alur Tujuan Pembelajaran (ATP) from Fase E and Fase F Capaian Pembelajaran (CP), design deep learning experiences in the Memahami, Mengaplikasi, and Merefleksi stages mapped to SOLO levels, target the 8 Dimensi Profil Lulusan, build differentiated LKPD and formative checkpoints, keep the TKA in view as the final summative context, and turn assessment follow-up bands into concrete classroom intervention scenarios."
