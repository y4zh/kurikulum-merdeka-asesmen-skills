name: "kurikulum_merdeka_paud_tk"
title: "Kurikulum Merdeka PAUD & TK/RA"
description: "One level-specific skill for Indonesian Kurikulum Merdeka PAUD and TK/RA only (early childhood: Kelompok Bermain, Taman Kanak-Kanak, Raudhatul Athfal) holding all five roles for this level: play-based teaching modules (modul ajar) that turn the PAUD CP elements into play goals across learning centres with observation points, concrete stimulus media design (real objects, large pictures, songs and movement, puppets, oral picture stories) that must pass a functionality test, observation-based assessment instruments (checklists, anecdotal records, developmental rating scales, performance rubrics) interpreted in the BB, MB, BSH, and BSB developmental categories with play-based follow-up stimulation instead of remedial, independent qualitative review of instruments with accept, revise, or reject verdicts and indicator surgery, and conversion of finished instrument sets into printable observation sheets, portfolio checklists, and narrative child development report formats, with no written tests, no multiple choice, and no CBT or item-bank export at this level."
category: "Work and knowledge"
include_in_prompt: false
